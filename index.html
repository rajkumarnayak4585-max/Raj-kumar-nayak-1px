
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raj 1PX 5G</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050816;
    color: white;
    text-align: center;
}

header {
    padding: 45px 15px;
    background: linear-gradient(135deg, #001eff, #9b00ff);
}

h1 {
    font-size: 42px;
    text-shadow: 0 0 15px cyan;
}

.card {
    margin: 25px auto;
    padding: 25px;
    width: 90%;
    max-width: 450px;
    background: #101b35;
    border: 2px solid #00eaff;
    border-radius: 20px;
    box-shadow: 0 0 20px #005eff;
}

h2 {
    color: #00eaff;
}

.name {
    font-size: 25px;
    color: #ffdd00;
}

.network {
    font-size: 55px;
    font-weight: bold;
    color: #00ff9d;
    text-shadow: 0 0 20px #00ff9d;
}

button {
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #00eaff;
    color: #050816;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffdd00;
    transform: scale(1.05);
}

footer {
    padding: 20px;
    color: #aaa;
}
</style>
</head>

<body>

<header>
    <h1>⚡ RAJ 1PX 5G ⚡</h1>
    <p>Welcome to My Digital World</p>
</header>

<div class="card">
    <div class="network">5G</div>
    <h2>🚀 SUPER FAST NETWORK</h2>
    <p>Speed • Technology • Future</p>
</div>

<div class="card">
    <h2>मेरा परिचय</h2>

    <p class="name">Raj Kumar Nayak</p>

    <p>🎓 Class: 9th</p>
    <p>💻 My Website: Raj 1PX 5G</p>

    <button onclick="showMessage()">
        CLICK HERE ⚡
    </button>

    <h3 id="message"></h3>
</div>

<footer>
    <p>Created by Raj Kumar Nayak</p>
    <p>Class 9th | RAJ 1PX 5G</p>
    <p>⚡ Dream Big • Work Hard ⚡</p>
</footer>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
        "🔥 Welcome Raj Kumar Nayak! 🔥";
}
</script>

</body>
</html>
